# Fabrique l'APK de Foteli à chaque envoi de code (docs/v0/technique.md § 5).
name: APK Foteli

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fabriquer et vérifier l'APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nommer.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé de signature (si elle est configurée)
        env:
          KEYSTORE_BASE64: ${{ secrets.FOTELI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foteli-release.p12"
            echo "FOTELI_KEYSTORE_FILE=$RUNNER_TEMP/foteli-release.p12" >> "$GITHUB_ENV"
            echo "SIGNED=signee" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucune clé de signature configurée : APK de test, non mettable à jour par une version signée."
            echo "SIGNED=test" >> "$GITHUB_ENV"
          fi

      - name: Tests automatiques (code PIN, code de secours, robots)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compiler (version finale + version d'aperçu)
        env:
          FOTELI_KEYSTORE_PASSWORD: ${{ secrets.FOTELI_KEYSTORE_PASSWORD }}
          FOTELI_KEY_ALIAS: ${{ secrets.FOTELI_KEY_ALIAS }}
          FOTELI_KEY_PASSWORD: ${{ secrets.FOTELI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Vérifier l'absence de permission Internet
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          APK=app/build/outputs/apk/release/app-release.apk
          "$AAPT2" dump permissions "$APK"
          if "$AAPT2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::L'APK demande la permission Internet : c'est interdit (docs/v0/technique.md § 4)."
            exit 1
          fi
          echo "OK : aucune permission Internet."

      - name: Nommer les APK
        id: nommer
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/foteli-${VERSION}-${SIGNED}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk out/foteli-apercu.apk
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK à installer
        uses: actions/upload-artifact@v4
        with:
          name: foteli-${{ env.VERSION }}-${{ env.SIGNED }}
          path: out/foteli-${{ env.VERSION }}-${{ env.SIGNED }}.apk

      - name: Préparer le fichier pour la page Releases
        run: cp "out/foteli-${VERSION}-${SIGNED}.apk" out/foteli.apk

      - name: Garder le fichier pour la page Releases
        uses: actions/upload-artifact@v4
        with:
          name: foteli-release
          path: out/foteli.apk
          retention-days: 7

      - name: Garder la version d'aperçu (pour les captures)
        uses: actions/upload-artifact@v4
        with:
          name: foteli-apercu
          path: out/foteli-apercu.apk
          retention-days: 7

  release:
    name: Publier l'APK sur la page Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: foteli-release

      - name: Lire la version
        run: echo "VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      # Lien direct et stable vers la dernière APK, à mettre en favori sur la tablette :
      # https://github.com/<dépôt>/releases/latest/download/foteli.apk
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Foteli ${{ env.VERSION }}
          make_latest: "true"
          overwrite_files: true
          files: foteli.apk
          body: |
            ### Aperçu (tablette virtuelle Android 14, classe de démonstration)
            ![Premier lancement](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/capture-1-premier-lancement.png)
            ![Accueil des élèves](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/capture-2-accueil-eleves.png)
            ![Code enseignant](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/capture-3-code-enseignant.png)
            ![Classe](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/capture-4-classe.png)
            ![Ajouter un élève](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/capture-5-ajout-eleve.png)
            ![Code enseignant sur un écran de téléphone](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/capture-6-code-sur-telephone.png)
            ![Accueil des élèves, mode Nuit](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/capture-7-accueil-nuit.png)
            ![Réglages et choix de l'apparence, mode Nuit](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/capture-8-reglages-nuit.png)

            **Installer sur la tablette** : touchez `foteli.apk` ci-dessous depuis le navigateur de la tablette, puis acceptez « Installer des applis inconnues ».

            Lien direct toujours à jour (à mettre en favori) :
            https://github.com/${{ github.repository }}/releases/latest/download/foteli.apk

            Guide complet : docs/installer-et-tester.md

  apercu:
    name: Captures d'écran sur une tablette virtuelle
    needs: [build, release]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Activer l'accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: foteli-apercu

      - name: Lancer Foteli sur une tablette Android 14 virtuelle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: |
            adb install -r foteli-apercu.apk
            adb shell am start -W -n io.github.ploufty.foteli/.MainActivity
            sleep 8
            adb exec-out screencap -p > capture-1-premier-lancement.png
            adb shell am start -W -S -n io.github.ploufty.foteli/.MainActivity --ez demo true
            sleep 8
            adb exec-out screencap -p > capture-2-accueil-eleves.png
            adb shell am start -W -S -n io.github.ploufty.foteli/.MainActivity --ez demo true --es screen pin
            sleep 6
            adb exec-out screencap -p > capture-3-code-enseignant.png
            adb shell am start -W -S -n io.github.ploufty.foteli/.MainActivity --ez demo true --es screen teacher
            sleep 6
            adb exec-out screencap -p > capture-4-classe.png
            adb shell am start -W -S -n io.github.ploufty.foteli/.MainActivity --ez demo true --es screen edit
            sleep 6
            adb exec-out screencap -p > capture-5-ajout-eleve.png
            adb shell cmd uimode night yes
            adb shell am start -W -S -n io.github.ploufty.foteli/.MainActivity --ez demo true
            sleep 6
            adb exec-out screencap -p > capture-7-accueil-nuit.png
            adb shell am start -W -S -n io.github.ploufty.foteli/.MainActivity --ez demo true --es screen settings
            sleep 6
            adb exec-out screencap -p > capture-8-reglages-nuit.png
            adb shell cmd uimode night no
            adb shell wm size 2400x1080
            adb shell wm density 420
            adb shell am start -W -S -n io.github.ploufty.foteli/.MainActivity --ez demo true --es screen pin
            sleep 6
            adb exec-out screencap -p > capture-6-code-sur-telephone.png
            adb shell wm size reset
            adb shell wm density reset

      - uses: actions/upload-artifact@v4
        with:
          name: captures-ecran
          path: capture-*.png

      # Les captures s'affichent directement sur la page Releases : rien à télécharger ni à installer.
      - name: Ajouter les captures à la page Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          overwrite_files: true
          files: capture-*.png
